<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerFS trajectory</title>
<link rel="stylesheet" href="style.css">
<script src="_magpie/bridge.js"></script>
<script src="trajectory.js"></script>
<script src="view.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<header>
  <div class="hist">
    <h1 id="histLine">HISTORY</h1>
    <p class="hist-meta" id="histMeta"></p>
  </div>
  <div class="menu" id="projectMenu" hidden>
    <button type="button" id="projBtn" aria-haspopup="listbox" aria-expanded="false"></button>
    <div class="menu-list" id="projList" role="listbox" aria-label="project" hidden></div>
  </div>
  <p class="stamp" id="stamp"></p>
</header>

<section class="stats" id="stats">
  <div class="tiles">
    <div class="tile"><span class="k" data-t="checkpointsK">Checkpoints</span><span class="v" id="nCommits">0 / 0</span></div>
    <div class="tile"><span class="k" data-t="branchesK">Branches</span><span class="v" id="tBranches">0</span></div>
    <div class="tile"><span class="k" data-t="asCopies">as copies</span><span class="v" id="vCopies">0 B</span></div>
    <div class="tile"><span class="k" data-t="stored">stored</span><span class="v" id="vStored">0 B</span></div>
    <div class="tile"><span class="k" data-t="dedupe">dedupe</span><span class="v" id="tDedup">–</span><span class="s saved" id="vSaved"></span></div>
  </div>
  <div class="bar-row"><span class="bar-label" data-t="asCopies">as copies</span><div class="bar"><i id="barCopies" class="copies"></i></div></div>
  <div class="bar-row"><span class="bar-label" data-t="stored">stored</span><div class="bar"><i id="barStored" class="stored"></i></div></div>
  <p class="stats-line" id="statsLine"></p>
</section>

<div class="stage" id="stage"><svg id="graph" role="img" aria-label="worktree trajectory"></svg></div>
<div class="legend" id="legend" hidden></div>

<section class="controls" id="controls">
  <button type="button" id="play" class="primary">Replay</button>
  <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="replay position">
  <div class="seg" id="speed" role="group" aria-label="speed">
    <button type="button" data-speed="0.5">0.5×</button>
    <button type="button" data-speed="1" aria-selected="true">1×</button>
    <button type="button" data-speed="2">2×</button>
    <button type="button" data-speed="4">4×</button>
  </div>
</section>

<section class="detail" id="detail">
  <div class="d-head"><span class="d-branch"><i id="dDot" class="d-dot"></i><span id="dBranch"></span></span><span class="d-time" id="dTime"></span></div>
  <p class="d-msg" id="dMsg"></p>
  <p class="d-meta"><span id="dMeta"></span> <span id="dDelta" class="delta"></span></p>
</section>

<p class="empty" id="empty" hidden></p>
</body>
</html>
